openapi: 3.0.3
info:
  title: 校服项目辅助决策接口
  version: 1.0.0
servers:
  - url: /
paths:
  /school/index/statistics/platformUsage:
    get:
      summary: 平台使用情况
      parameters:
        - name: deptId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 部门ID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUsageResponse"
              example:
                code: 200
                msg: 操作成功
                data:
                  districtPlatformTotal: 12
                  schoolPlatformTotal: 85
                  studentPlatformTotal: 4600

  /school/index/statistics/priceTrendData:
    get:
      summary: 价格趋势分析
      parameters:
        - name: deptId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 部门ID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyValueListResponse"
              example:
                code: 200
                msg: 操作成功
                data:
                  - key: "2026-01"
                    value: 128.5
                  - key: "2026-02"
                    value: 132.0
                  - key: "2026-03"
                    value: 129.8

components:
  schemas:
    AjaxResult:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: 操作成功
        data:
          nullable: true

    KeyValueVo:
      type: object
      properties:
        key:
          type: string
        value:
          oneOf:
            - type: string
            - type: integer
            - type: number

    PlatformUsageData:
      type: object
      properties:
        districtPlatformTotal:
          type: integer
          format: int64
        schoolPlatformTotal:
          type: integer
          format: int64
        studentPlatformTotal:
          type: integer
          format: int64

    PlatformUsageResponse:
      allOf:
        - $ref: "#/components/schemas/AjaxResult"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PlatformUsageData"

    KeyValueListResponse:
      allOf:
        - $ref: "#/components/schemas/AjaxResult"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/KeyValueVo"
