version : '3.8'
services:
  xfglpt-nacos:
    container_name: xfglpt-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - xfglpt-mysql
  xfglpt-mysql:
    container_name: xfglpt-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  xfglpt-redis:
    container_name: xfglpt-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/xfglpt/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/xfglpt/redis/redis.conf
  xfglpt-nginx:
    container_name: xfglpt-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/xfglpt/projects/xfglpt-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - xfglpt-gateway
    links:
      - xfglpt-gateway
  xfglpt-gateway:
    container_name: xfglpt-gateway
    build:
      context: ./xfglpt/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - xfglpt-redis
    links:
      - xfglpt-redis
  xfglpt-auth:
    container_name: xfglpt-auth
    build:
      context: ./xfglpt/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - xfglpt-redis
    links:
      - xfglpt-redis
  xfglpt-modules-system:
    container_name: xfglpt-modules-system
    build:
      context: ./xfglpt/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - xfglpt-redis
      - xfglpt-mysql
    links:
      - xfglpt-redis
      - xfglpt-mysql
  xfglpt-modules-gen:
    container_name: xfglpt-modules-gen
    build:
      context: ./xfglpt/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - xfglpt-mysql
    links:
      - xfglpt-mysql
  xfglpt-modules-job:
    container_name: xfglpt-modules-job
    build:
      context: ./xfglpt/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - xfglpt-mysql
    links:
      - xfglpt-mysql
  xfglpt-modules-file:
    container_name: xfglpt-modules-file
    build:
      context: ./xfglpt/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./xfglpt/uploadPath:/home/xfglpt/uploadPath
  xfglpt-visual-monitor:
    container_name: xfglpt-visual-monitor
    build:
      context: ./xfglpt/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
